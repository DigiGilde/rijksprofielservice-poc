<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Rijksprofielservice{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    nav { display: flex; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; }
    nav a { color: #154273; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    h1 { font-size: 1.5rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #eee; }
    button, .btn { background: #154273; color: white; border: 0; padding: 0.4rem 0.8rem; cursor: pointer; border-radius: 3px; display: inline-block; text-decoration: none; font: inherit; }
    button:disabled { background: #b0b8c4; cursor: not-allowed; }
    button.danger { background: #a90000; }
    .field { margin: 0.75rem 0; }
    .field label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    .field input, .field textarea { width: 100%; padding: 0.4rem; border: 1px solid #ccc; border-radius: 3px; }
    /* Checkboxes mogen niet 100% breed worden zoals de globale .field input regel doet. */
    .field input[type="checkbox"] { width: auto; vertical-align: middle; margin: 0; }
    .checkbox-list ul { list-style: none; padding: 0; margin: 0.25rem 0 0; }
    .checkbox-list li { margin: 0.15rem 0; display: flex; align-items: center; gap: 0.4rem; }
    .checkbox-list li label { display: inline; font-weight: normal; }
    .field-inline { margin-top: 1rem; display: flex; align-items: center; gap: 0.4rem; }
    .field-inline label { display: inline; font-weight: normal; margin: 0; }
    .notice { background: #fff8d8; border: 1px solid #e6cf6c; border-radius: 3px; padding: 0.6rem 0.8rem; margin: 0 0 1rem; font-size: 0.95rem; }
    img.avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #ddd; font-size: 0.9rem; color: #666; }
    footer a { color: #154273; }
    article.privacy h1 { font-size: 1.5rem; }
    article.privacy h2 { font-size: 1.15rem; margin-top: 1.5rem; }
    .docs-layout { display: flex; gap: 1.25rem; align-items: flex-start; }
    .docs-sidebar { flex: 0 0 8rem; font-size: 0.9rem; border-right: 1px solid #eee; padding-right: 0.75rem; }
    .docs-sidebar h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #666; margin: 0 0 0.5rem; }
    .docs-sidebar ul { list-style: none; padding: 0; margin: 0; }
    .docs-sidebar li { margin: 0.25rem 0; }
    .docs-sidebar a { color: #154273; text-decoration: none; }
    .docs-sidebar a:hover { text-decoration: underline; }
    .docs-sidebar a[aria-current="page"] { font-weight: 600; color: #1a1a1a; }
    .docs-content { flex: 1 1 auto; min-width: 0; }
    @media (max-width: 640px) {
      .docs-layout { flex-direction: column; }
      .docs-sidebar { flex: none; border-right: 0; border-bottom: 1px solid #eee; padding: 0 0 0.75rem; width: 100%; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url('profile-edit') }}">Mijn profiel</a>
    <a href="{{ url('consent-list') }}">Toestemmingen</a>
    <span style="margin-left:auto;">
      {% if request.user.is_authenticated %}
        {{ request.user.email }} · <a href="{{ url('logout') }}">Uitloggen</a>
      {% else %}
        <a href="{{ url('login') }}">Inloggen</a>
      {% endif %}
    </span>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <a href="{{ url('privacy') }}">Privacyverklaring</a>
    · <a href="{{ url('docs-index') }}">Docs</a>
  </footer>
</body>
</html>
